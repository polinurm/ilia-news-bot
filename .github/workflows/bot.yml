name: Run python bot.py

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main  # Жестко заставляем скачивать файлы из ветки main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Check Files
        run: |
          echo "=== СПИСОК ФАЙЛОВ В РЕПОЗИТОРИИ ==="
          ls -la
          echo "==================================="

      - name: Run Bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --cached --quiet || (git commit -m "update state" && git push)
          else
            echo "Файл state.json отсутствует."
          fi
